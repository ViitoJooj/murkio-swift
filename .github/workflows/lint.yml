name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Compiler warnings (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy@sha256:b394f699c1844fabf5c01d8a5673639141dc007f500661a4fa56f4ba1f23d87b
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the library and the tests with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

  apple:
    name: Compiler warnings (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: swift --version && xcodebuild -version

      - name: Build the library and the tests with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors
