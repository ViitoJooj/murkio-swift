name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy@sha256:b394f699c1844fabf5c01d8a5673639141dc007f500661a4fa56f4ba1f23d87b
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test

  apple:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: swift --version && xcodebuild -version

      - name: Run tests
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          MURKIO_SCREENSHOTS="$RUNNER_TEMP/shots" swift test

      # The canvas as SwiftUI drew it, to look at when a layout test fails.
      - name: Keep the canvas screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-canvas
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
